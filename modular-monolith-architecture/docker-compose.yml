services:
  api:
    build:
      context: .
      dockerfile: devops/docker/api.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Server=sqlserver;Database=ECommerceDb;User Id=sa;Password=${SQLSERVER_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=True
      Jwt__SecretKey: ${JWT_SECRET_KEY}
      Jwt__Issuer: ECommerce.API
      Jwt__Audience: ECommerce.Client
    depends_on:
      sqlserver:
        condition: service_healthy
    expose:
      - "8080"

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQLSERVER_SA_PASSWORD}
      MSSQL_PID: Developer
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "pidof sqlservr || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      dockerfile: devops/docker/angular.Dockerfile
    depends_on:
      - api
    ports:
      - "8088:80"

volumes:
  sqlserver-data:
